<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #153677, #4e085f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 540px;
        }

        .todo-app {
            background: #fff;
            padding: 40px 30px 70px;
            border-radius: 10px;
        }

        .todo-app h2 {
            color: #002765;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #edeef0;
            border-radius: 30px;
            padding-left: 20px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 10px;
        }

        button {
            border: none;
            outline: none;
            padding: 16px 50px;
            background: #ff5945;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 40px;
        }

        ul li {
            list-style: none;
            font-size: 17px;
            padding: 12px 8px 12px 50px;
            user-select: none;
            cursor: pointer;
            position: relative;
        }

        ul li::before {
            content: '';
            position: absolute;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            border: 1px solid #ccc;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        ul li.checked::before {
            content: '✓';
            color: #fff;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ff5945; 
            border: none;
        }

       
        ul li.checked {
            color: #555;
            text-decoration: line-through;
        }

       
        ul li span {
            position: absolute;
            right: 0;
            top: 5px;
            width: 40px;
            height: 40px;
            font-size: 22px;
            color: #555;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
        }

        ul li span:hover {
            background: #edeef0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="todo-app">
            <h2>To-Do List <img src="https://cdn-icons-png.flaticon.com/512/4345/4345573.png" width="30px" style="margin-left: 10px;"></h2>
            
            <div class="row">
                <input type="text" id="input-box" placeholder="Add your task">
                <button onclick="addTask()" id="click">Add</button>
            </div>

            <ul id="list-container">
              
            </ul>
        </div>
    </div>

<script>
    const inputBox = document.getElementById("input-box");
    const listContainer = document.getElementById("list-container");
    const click = document.getElementById("click")

    function addTask() {
        if (inputBox.value === '') {
            alert("You must write something!");
        } else {
            let li = document.createElement("li");
            li.innerHTML = inputBox.value;
            listContainer.appendChild(li);

            let span = document.createElement("span");
            span.innerHTML = "\u00d7"; 
            li.appendChild(span);
        }
        inputBox.value = "";
        saveData()
    }

    listContainer.addEventListener("click", function(e) {
        if (e.target.tagName === "LI") {
            e.target.classList.toggle("checked");
            saveData()
        } 
        else if (e.target.tagName === "SPAN") {
            e.target.parentElement.remove();
            saveData()
        }
    }, false);
    function saveData(){
        localStorage.setItem("data", listContainer.innerHTML);
    }
    function showData(){
        listContainer.innerHTML = localStorage.getItem("data");
    }
    showData();
inputBox.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        addTask();
    }
});
</script>

</body>
</html>
